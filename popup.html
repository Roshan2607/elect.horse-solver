
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elect Horse Solver</title>

<style>
:root {
  color-scheme: dark;
  font-family: system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  width: 360px;
  margin: 0;
  background: #101d1a;
  color: #eef8f0;
  font-size: 13px;
}

button, select {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 17px 18px;
  border-bottom: 1px solid #2a4036;
}

h1 {
  font-size: 18px;
  font-weight: 750;
  letter-spacing: -0.6px;
  margin: 0;
}

h1 span {
  color: #f4c650;
}

.version {
  font-size: 11px;
  color: #87ac98;
}

main {
  padding: 16px 18px 12px;
}

.row {
  display: flex;
  gap: 9px;
}

.button {
  border: 1px solid #355746;
  border-radius: 10px;
  padding: 11px 12px;
  font-weight: 650;
  background: #1c352a;
  color: #e9f4ea;
}

.button:disabled {
  opacity: 0.38;
  cursor: not-allowed;
}

.button:hover:not(:disabled) {
  filter: brightness(1.1);
}

button:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 2px solid #f4c650;
  outline-offset: 2px;
}

#scan {
  flex: 1;
  background: #f4c650;
  color: #18271c;
  border-color: #f4c650;
}

#clear {
  background: transparent;
  min-width: 65px;
}

.settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 15px 0 12px;
}

label {
  display: block;
  margin-bottom: 6px;
  color: #a8c6b5;
  font-size: 11px;
}

select {
  width: 100%;
  height: 37px;
  padding: 0 10px;
  border: 1px solid #365648;
  border-radius: 8px;
  background: #172c23;
  color: #eaf5eb;
}

.stats {
  min-height: 18px;
  font-size: 11px;
  color: #afcdbd;
  margin: 2px 0 10px;
  line-height: 1.6;
}

.stats .chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-right: 9px;
}

.stats .chip:before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c);
}

.stats .meta {
  display: block;
  margin-bottom: 3px;
  color: #7fa792;
}

#board {
  display: none;
  width: 100%;
  height: 174px;
  margin: 4px 0 8px;
  border: 1px solid #365a47;
  border-radius: 10px;
  background: #19633d;
  cursor: crosshair;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  font-size: 10px;
  color: #bad2c3;
  margin-bottom: 13px;
}

.legend[hidden] {
  display: none;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
}

.actions {
  display: grid;
  grid-template-columns: 1.12fr 1fr;
  gap: 9px;
  margin-top: 13px;
}

#solve {
  background: #37bd83;
  color: #09251b;
  border-color: #37bd83;
}

#place {
  background: #1c362c;
}

#status {
  font-size: 11px;
  line-height: 1.5;
  min-height: 17px;
  margin: 12px 0 0;
  color: #a6c6b4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#status.error {
  color: #ffaaaa;
}

#results {
  display: none;
  margin-top: 12px;
  border: 1px solid #315544;
  background: #172d23;
  border-radius: 9px;
  padding: 11px;
  font-size: 11px;
  line-height: 1.6;
}

#results strong {
  font-size: 12px;
}

#results .muted {
  color: #a0b9a9;
}

#results details {
  margin-top: 7px;
}

#results summary {
  cursor: pointer;
  color: #d2e6d7;
}

#results .districts {
  margin-top: 5px;
  color: #b5d0bf;
}

footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-top: 1px solid #2a4036;
  padding: 11px 18px 14px;
  color: #7ea994;
  font-size: 10px;
}

footer summary {
  cursor: pointer;
  color: #b8d3c3;
}

footer details p {
  max-width: 165px;
  line-height: 1.5;
  color: #afc9b9;
}
</style>
</head>

<body>

<header>
  <h1>elect<span>.horse</span> / Solver</h1>
  <span class="version">v0.4</span>
</header>

<main>

  <div class="row">
    <button id="scan" class="button">
      Capture board
    </button>

    <button id="clear" class="button">
      Hide
    </button>
  </div>

  <div class="settings">

    <div>
      <label for="districts">Districts</label>
      <select id="districts">
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
      </select>
    </div>

    <div>
      <label for="effort">Search</label>
      <select id="effort">
        <option value="normal">Normal</option>
        <option value="deep">Deep</option>
      </select>
    </div>

  </div>

  <div id="stats" class="stats">
    No board captured
  </div>

  <svg
    id="board"
    viewBox="0 0 400 210"
    role="img"
    aria-label="Detected board">
  </svg>

  <div id="legend" class="legend" hidden>
    <span><i class="dot" style="background:#5fd3ff"></i>Horse</span>
    <span><i class="dot" style="background:#ff4d6d"></i>Cow</span>
    <span><i class="dot" style="background:#b58cff"></i>Donkey</span>
    <span><i class="dot" style="background:#f4dc73"></i>Goat</span>
  </div>

  <div class="actions">
    <button id="solve" class="button" disabled>
      Solve &amp; preview
    </button>

    <button id="place" class="button" disabled>
      Auto-place
    </button>
  </div>

  <div id="results"></div>

  <p id="status" role="status">
    Open a level, then capture.
  </p>

</main>

<footer>
  <span>Local only · No auto-submit</span>

  <details>
    <summary>Help</summary>
    <p>
      Keep the full board visible.
      Click a hex to correct it.
      Auto-place uses simulated clicks and may not work.
    </p>
  </details>
</footer>

<script src="parser.js"></script>
<script src="popup.js"></script>

</body>
</html>
